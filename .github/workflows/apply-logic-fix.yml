name: Apply logical bot fixes

on:
  push:
    branches:
      - audit/error-monitoring
    paths:
      - .github/workflows/apply-logic-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild audited bot.py
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/bot.py.gz.b64 <<'B64'
          
          
          
          B64
          tr -d '\n ' < /tmp/bot.py.gz.b64 | base64 -d | gzip -dc > bot.py
          test "$(sha256sum bot.py | awk '{print $1}')" = "952ccc0118a14eccc938cee7604e34b9702c02c515df18ea482b5a4fae4fec3a"
          python -m py_compile bot.py

      - name: Commit bot.py
        shell: bash
        run: |
          set -euo pipefail
          git add bot.py
          if git diff --cached --quiet; then
            echo "No bot.py changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: correct questionnaire and admin logic"
          git push origin HEAD:audit/error-monitoring
