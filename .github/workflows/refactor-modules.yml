name: Apply modular refactor

on:
  push:
    branches:
      - audit/error-monitoring
    paths:
      - .github/workflows/refactor-modules.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate modules
        run: python scripts/refactor_monolith.py

      - name: Compile generated source
        run: python -m compileall -q bot.py app tests

      - name: Commit modular structure
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/refactor_monolith.py .github/workflows/refactor-modules.yml
          rmdir scripts 2>/dev/null || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: split bot into maintainable modules"
          git push origin HEAD:audit/error-monitoring
