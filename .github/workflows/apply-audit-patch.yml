name: Apply bot audit patch

on:
  push:
    branches:
      - audit/error-monitoring
    paths:
      - audit/bot-error-monitoring.patch
      - .github/workflows/apply-audit-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited changes
        shell: bash
        run: |
          set -euo pipefail
          if git apply --check audit/bot-error-monitoring.patch; then
            git apply audit/bot-error-monitoring.patch
          elif git apply --reverse --check audit/bot-error-monitoring.patch; then
            echo "Patch is already applied."
          else
            echo "Patch no longer matches bot.py; refusing to guess."
            exit 1
          fi

      - name: Syntax check
        run: python -m py_compile bot.py

      - name: Commit patched bot
        shell: bash
        run: |
          set -euo pipefail
          git add bot.py
          if git diff --cached --quiet; then
            echo "No bot.py changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: add runtime error monitoring and consistency guards"
          git push origin HEAD:audit/error-monitoring
