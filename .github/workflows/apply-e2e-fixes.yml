# one-time workflow: self-removes after applying fixes
name: Apply E2E fixes

on:
  push:
    branches:
      - audit/error-monitoring
    paths:
      - .github/workflows/apply-e2e-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified fixes
        run: python scripts/apply_e2e_fixes.py

      - name: Remove one-time files and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/apply_e2e_fixes.py .github/workflows/apply-e2e-fixes.yml
          git add app/ui.py app/handlers/form.py app/handlers/decisions.py tests/test_e2e.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: harden stale navigation and contact delivery status"
          git push origin HEAD:audit/error-monitoring
