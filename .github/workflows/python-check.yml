name: Python checks

on:
  push:
    branches:
      - main
      - audit/error-monitoring
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile bot.py

      - name: Import bot with safe test environment
        env:
          BOT_TOKEN: test-token-not-used-during-import
          ADMIN_CHAT_ID: "-1001234567890"
          ADMIN_IDS: "123456789"
          DB_PATH: ":memory:"
          LOG_FILE: ""
          ERROR_WEBHOOK_URL: ""
        run: |
          python - <<'PY'
          import bot
          error_id, payload = bot._build_error_payload(RuntimeError("ci-test"), "ci")
          assert len(error_id) == 12
          assert payload["context"] == "ci"
          assert payload["exception_type"] == "RuntimeError"
          print("bot import and diagnostic helpers: OK")
          PY
